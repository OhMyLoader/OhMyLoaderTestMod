name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The whole runtime layer resolves by Maven coordinate: publish the loader (all
      # publications, oml-native included — hence zig) and the plugin into mavenLocal,
      # exactly the documented development loop, then build.
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoaderGradle
          ref: main
          path: OhMyLoaderGradle
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: gradle/actions/setup-gradle@v6
      # Build-cache entries are content-addressed by task inputs, so a stale snapshot only
      # lowers the hit rate, never yields wrong outputs — the key can err on the coarse side.
      # A source fingerprint misses the exact key once per source change, restores the latest
      # snapshot via the prefix and saves the new outputs on top; a static key would exact-hit
      # forever and never store anything new (save is skipped on exact hits). Placed after the
      # sibling checkouts so the fingerprint also covers the loader and plugin sources this
      # build consumes through mavenLocal. modules-2 stays out: dependency resolution has its
      # own surface and would blow the 10 GB repo cap.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts', '**/*.java', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      - run: ./gradlew -p OhMyLoader publishToMavenLocal
      - run: ./gradlew -p OhMyLoaderGradle publishToMavenLocal
      - run: ./gradlew build

  # The gate the build job cannot be: it actually launches the game. Both E2E jobs start the same way
  # (three checkouts + publish the layer into mavenLocal), because mavenLocal is per-job.
  e2e-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoaderGradle
          ref: main
          path: OhMyLoaderGradle
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: gradle/actions/setup-gradle@v6
      # Same build-cache snapshot as the build job (see there); covers all three gradle
      # invocations below, the two mavenLocal publications included.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts', '**/*.java', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            run/26.3/minecraft
            run/26.3/libraries
            run/26.3/natives
          key: game-files-26.3
      - run: ./gradlew -p OhMyLoader publishToMavenLocal
      - run: ./gradlew -p OhMyLoaderGradle publishToMavenLocal
      # First prove the gate can go red: an expectation nothing reports must fail the run, otherwise a
      # green verdict means nothing. Cheap — it ends as soon as the tick budget is spent.
      - name: The gate must be able to fail
        env:
          OML_E2E_EXPECT_EXTRA: gate.self-test.never-reported
          OML_E2E_GRACE_SECONDS: '20'
          OML_E2E_LOG: build/e2e-server-selftest.log
        run: |
          if ./scripts/e2e-server.sh; then
            echo "::error::the E2E gate passed a run that was supposed to fail"
            exit 1
          fi
          # A red exit alone is not proof: a crash, a resolution failure or a build problem exits 1 as
          # well, and this job once went red on every run for a reason unrelated to the gate. The
          # self-test counts only when the log names the expectation nothing reported.
          grep -E '\[OML-E2E\] FAILED gate\.self-test\.never-reported \(never reported\)' \
            build/e2e-server-selftest.log
          grep -E '\[OML-E2E\] RESULT FAIL' build/e2e-server-selftest.log
          echo "gate self-test passed (the gate reported the expectation nothing reported)"
      - name: Server end-to-end
        env:
          # OML's console mirror (-Doml.log.file) has no other caller in CI; without this step the
          # shipped feature never runs. The artifact below requires the file, so a mirror that wrote
          # nothing is red rather than an absent attachment.
          OML_LOG_FILE: logs/oml-console.log
        run: ./scripts/e2e-server.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-server-logs
          path: |
            build/e2e-server*.log
            run/server/logs/oml-console.log
          if-no-files-found: error

  e2e-client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoader
          ref: main
          path: OhMyLoader
      - uses: actions/checkout@v7
        with:
          repository: OhMyLoader/OhMyLoaderGradle
          ref: main
          path: OhMyLoaderGradle
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '27'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: gradle/actions/setup-gradle@v6
      # Same build-cache snapshot as the build job (see there); covers all three gradle
      # invocations below, the two mavenLocal publications included.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-*
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts', '**/*.java', 'gradle/libs.versions.toml', 'gradle.properties') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            run/26.3/minecraft
            run/26.3/libraries
            run/26.3/natives
          key: game-files-26.3
      # No GPU on a runner: Xvfb for the display and Mesa's software Vulkan/GL (lavapipe/llvmpipe) for
      # the renderer 26.3 uses. OpenAL is installed so the client does not log a sound-engine failure.
      - name: Headless rendering stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0 libopenal1
      - run: ./gradlew -p OhMyLoader publishToMavenLocal
      - run: ./gradlew -p OhMyLoaderGradle publishToMavenLocal
      - name: Client end-to-end (main menu, then self-quit)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
          # llvmpipe/lavapipe: booting to the title screen and loading the world take minutes, and
          # the grace clock runs from JVM start — the 120s local-GPU default expires mid-join.
          # 360s still expired (READY incomplete at ticks=7452 with the render thread healthy at
          # ~20fps the whole window); 720s covers the load, and the per-600-ticks client-state
          # lines in the verdict log tell a still-loading join from a refused one if this is red.
          OML_E2E_TIMEOUT: '900'
          OML_E2E_WATCHDOG: '840'
          OML_E2E_GRACE_SECONDS: '720'
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./scripts/e2e-client.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-client-logs
          path: build/e2e-client*.log
          if-no-files-found: ignore
